[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idkfa"
version = "0.3.0"
description = "Generador de cuestionarios Moodle XML desde plantillas C con autocompletado y CLI moderna"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN/yutani@6e42d7ab8b89a1084381f8aea0999a498a844f6c",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados (nunca por nombre: esos nombres están tomados en PyPI por terceros).
# Sin `ecosistema`, se compila con gcc directo; sin `languagetool`, spellcheck explica cómo
# instalarlo.
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@c2c589bce318b0d6d5d6b324fecc20f3b0f2a8ec",
]
languagetool = [
    "myst-tools @ git+https://github.com/INGCOM-UNRN/mystmd-tools@88762bba9abe40efec2884939aa81cda19eba90a",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/idkfa"
Repository = "https://github.com/INGCOM-UNRN/idkfa.git"
Issues = "https://github.com/INGCOM-UNRN/idkfa/issues"

[project.scripts]
idkfa = "idkfa.generacion:main"

[tool.hatch.build.targets.wheel]
packages = ["idkfa"]
force-include = { "generador.py" = "generador.py" }

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["idkfa"]
ignore_missing_imports = true
